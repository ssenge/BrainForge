# Generated by `brainforge schedule install --provider github-actions` for procedures with a round.
# Re-run that command to update it. Secrets: the same agent secret as brainforge-ingest.
# After each procedures run: an issue (label brainforge-round) for every round that opened, @mentioning its
# participants with their open items, and closed once the round's report is written. A reply there is the
# commenter's update: BrainForge ingests it as theirs and answers with what it took, for them to approve.
name: brainforge-rounds

on:
  workflow_run:  # the tick that opened or closed a round
    workflows: [brainforge-procedures]
    types: [completed]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  issues:
    if: ${{ github.event_name != 'issue_comment' }}
    concurrency:
      group: brainforge-rounds-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Open and close round issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: brainforge ci rounds

  reply:
    # Only people with write access, only on round issues, never the bot itself. No concurrency group: GitHub
    # keeps just the newest waiting run of a group, so replies arriving together would be lost. Runs that
    # overlap rebase or retry their push instead.
    if: >-
      ${{ github.event_name == 'issue_comment'
          && contains(github.event.issue.labels.*.name, 'brainforge-round')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
          && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge and the agent CLI
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          __AGENT_INSTALL__
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Take in the reply
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}  # passed as data, never interpolated into the script
          AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          for v in ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY; do [ -n "${!v}" ] || unset "$v"; done
          round=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/.*<!-- brainforge-round: \([^ ]*\) -->.*/\1/p' | head -n 1)
          set +e
          printf '%s\n' "$BODY" | brainforge ci reply --author "$AUTHOR" --round "$round" > "$RUNNER_TEMP/result.md" 2>&1
          status=$?
          [ -s "$RUNNER_TEMP/result.md" ] && gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/result.md"
          exit $status
