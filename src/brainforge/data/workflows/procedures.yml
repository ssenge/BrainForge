# Generated by `brainforge schedule install --provider github-actions` from procedure frontmatter.
# Re-run that command after changing a procedure's schedule.
# Each cron fires in the procedure's own timezone; `brainforge schedule tick` decides what is due,
# so delayed or duplicate triggers are harmless.
name: brainforge-procedures

on:
__SCHEDULE__  workflow_dispatch:
    inputs:
      procedure:
        description: "Procedure to run now (empty: run whatever is due)"
        required: false
        default: ""

concurrency:
  group: brainforge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # reports compare against the knowledge state of the previous report
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge and tools
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          __AGENT_INSTALL__
          __PANDOC__
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Run procedures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROCEDURE: ${{ inputs.procedure }}
        run: |
          for v in ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY; do [ -n "${!v}" ] || unset "$v"; done
          if [ -n "$PROCEDURE" ]; then
            brainforge run "$PROCEDURE" --push
          else
            brainforge schedule tick --push
          fi
