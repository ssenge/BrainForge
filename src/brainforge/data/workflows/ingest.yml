# Generated by `brainforge ci install`. Re-run that command to update it.
# Secrets (Settings → Secrets and variables → Actions):
#   Claude Code: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
#   Codex:       OPENAI_API_KEY
name: brainforge-ingest

on:
  push:
    paths: ["inbox/**"]
  workflow_dispatch:

concurrency:
  group: brainforge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    # Loop guard: BrainForge's own commits never re-trigger ingestion
    # (pushes made with GITHUB_TOKEN do not start workflows anyway).
    if: ${{ !contains(github.event.head_commit.message || '', 'BrainForge-Run:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch head, not the event commit: re-runs see the latest ledger
          fetch-depth: 0               # needed for the Ingest-Note trailers of earlier commits
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge and the agent CLI
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          __AGENT_INSTALL__
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Process inbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for v in ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY; do [ -n "${!v}" ] || unset "$v"; done
          brainforge inbox process --push
