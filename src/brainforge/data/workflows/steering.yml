# Generated by `brainforge schedule install --provider github-actions` for procedures that propose.
# Re-run that command to update it. No agent and no secrets: deciding on proposals is deterministic.
# After each procedures run: an issue (label brainforge-steering) for a report with proposals, @mentioning the
# leads, closed once all are decided or a newer report replaced them. A lead's `approve 1 3` / `discard 2` /
# `approve 2: <own words>` reply there carries them out as that lead.
name: brainforge-steering

on:
  workflow_run:  # the run that wrote a report with proposals
    workflows: [brainforge-procedures]
    types: [completed]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  issues:
    if: ${{ github.event_name != 'issue_comment' }}
    concurrency:
      group: brainforge-steering-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Open and close proposal issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: brainforge ci proposals

  decide:
    # Only people with write access, only on proposal issues, never the bot itself; BrainForge checks that the
    # commenter is a lead. No concurrency group: GitHub keeps just the newest waiting run of a group, so decisions
    # arriving together would be lost. Runs that overlap rebase, or pull and decide again.
    if: >-
      ${{ github.event_name == 'issue_comment'
          && contains(github.event.issue.labels.*.name, 'brainforge-steering')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
          && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Apply the decisions
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}  # passed as data, never interpolated into the script
          AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          report=$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/.*<!-- brainforge-proposals: \([^ ]*\) -->.*/\1/p' | head -n 1)
          set +e
          printf '%s\n' "$BODY" | brainforge ci decide --author "$AUTHOR" --proposals "$report" > "$RUNNER_TEMP/result.md" 2>&1
          status=$?
          [ -s "$RUNNER_TEMP/result.md" ] && gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/result.md"
          brainforge ci proposals  # closes the issue once everything is decided
          exit $status
