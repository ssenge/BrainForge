# Generated by `brainforge ci install`. Re-run that command to update it.
# Approvals without a local setup: on a schedule and after each ingestion, people with pending knowledge
# are @mentioned in an issue labelled `brainforge-approvals`. The scheduled run also leaves a message with the
# approvers of each newly overdue item (once per item and date) and @mentions them. Replying `approve <item>` or `discard <item>` there decides as
# that person: their `github` login in brain.yaml maps the comment to the team member. No agent, no secrets.
name: brainforge-approvals

on:
  schedule:
    - cron: "__REMIND__"  # UTC
  workflow_dispatch:
  workflow_run:  # right after an ingestion, about what it produced
    workflows: [brainforge-ingest]
    types: [completed]
  issue_comment:
    types: [created]

concurrency:
  group: brainforge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  remind:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versions and "changed since" come from history
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Post the reminder
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ github.event.workflow_run.head_sha }}  # empty on schedule and dispatch
        run: |
          if [ -n "$SINCE" ]; then  # after an ingestion: what it produced
            brainforge ci remind --since "$SINCE" > "$RUNNER_TEMP/reminder.md"
          else                      # everything pending, and newly overdue items
            brainforge ci remind --notify > "$RUNNER_TEMP/reminder.md"
          fi
          [ -s "$RUNNER_TEMP/reminder.md" ] || { echo "Nothing to post."; exit 0; }
          issue=$(gh issue list --label brainforge-approvals --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh label create brainforge-approvals --color 0E8A16 --force
            gh issue create --title "Knowledge awaiting approval" --label brainforge-approvals --body-file "$RUNNER_TEMP/reminder.md"
          else
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/reminder.md"
          fi

  decide:
    # Only people with write access, only in the reminder issue, never the bot itself.
    if: >-
      ${{ github.event_name == 'issue_comment'
          && contains(github.event.issue.labels.*.name, 'brainforge-approvals')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
          && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install BrainForge
        run: |
          uv tool install "__PACKAGE__"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure git
        run: |
          git config user.name "brainforge[bot]"
          git config user.email "brainforge-bot@users.noreply.github.com"
      - name: Apply the decisions
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}  # passed as data, never interpolated into the script
          AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set +e
          printf '%s\n' "$BODY" | brainforge ci decide --author "$AUTHOR" > "$RUNNER_TEMP/result.md" 2>&1
          status=$?
          [ -s "$RUNNER_TEMP/result.md" ] && gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/result.md"
          exit $status
