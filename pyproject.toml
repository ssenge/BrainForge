[project]
name = "brainforge"
version = "0.1.0"
description = "Git-native, agentic knowledge management on Open Knowledge Format (OKF) bundles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "cronsim>=2.6",
    "mcp>=1.9",
]

[project.scripts]
brainforge = "brainforge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
