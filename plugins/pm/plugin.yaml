name: pm
version: 5
description: Project management - milestones, decisions, actions, and a RAID log (risks, assumptions, issues, dependencies).
types:
  - type: Milestone
    group: milestones
    description: A planned point in the project, such as a go-live or the start of testing.
    deadline: date
    done: {state: [achieved, cancelled]}
    baseline: baseline
    waits_for: depends_on
    fields:
      owner: {description: "who is responsible, as written"}
      date: {description: "the current planned or actual date", format: date, expected: true}
      baseline: {description: "the first planned date, kept when the date moves", format: date}
      state: {values: [planned, achieved, missed, cancelled]}
      depends_on: {description: "what has to be done first: actions, dependencies, decisions", format: ids}
      step: {description: "the step of the project model it is, e.g. delivery/kickoff"}
  - type: Decision
    group: decisions
    description: Something that was decided or proposed for decision.
    deadline: decide_by
    done: {state: [confirmed, superseded]}
    fields:
      decided_by: {description: "who decided, as written", expected: true}
      decided_on: {format: date}
      decide_by: {description: "when it has to be decided, while it is proposed", format: date}
      state: {values: [proposed, confirmed, superseded]}
  - type: Action Item
    group: actions
    description: A task someone committed to.
    deadline: due
    done: {state: [done, cancelled]}
    waits_for: depends_on
    fields:
      owner: {description: "who does it, as written", expected: true}
      due: {format: date, expected: true}
      state: {values: [open, done, cancelled]}
      depends_on: {description: "what has to be done first", format: ids}
      step: {description: "the step of the project model it is, e.g. delivery/requirements"}
  - type: Risk
    group: risks
    description: Something that may happen and would affect the project.
    stale_after_days: 30
    fields:
      owner: {expected: true}
      likelihood: {values: [low, medium, high]}
      impact: {values: [low, medium, high]}
      mitigation: {description: "what is done about it, in a sentence"}
      state: {values: [open, mitigated, occurred, closed]}
  - type: Issue
    group: issues
    description: Something that has happened and affects the project.
    stale_after_days: 30
    fields:
      owner: {expected: true}
      severity: {values: [low, medium, high]}
      state: {values: [open, resolved]}
  - type: Assumption
    group: assumptions
    description: Something the plan takes for granted without proof.
    stale_after_days: 30
    fields:
      owner: {}
      state: {values: [open, confirmed, invalid]}
  - type: Dependency
    group: dependencies
    description: Something the project needs from outside it, such as a delivery from another team or a vendor.
    deadline: due
    done: {state: [met]}
    fields:
      owner: {}
      due: {format: date}
      state: {values: [open, met, late]}
  - type: Project
    group: projects
    description: The project itself, with its overall status.
    stale_after_days: 14
    fields:
      owner: {}
      rag: {description: "overall status, only when the document states it", values: [green, amber, red]}
      phase: {description: "the phase of the project model it is in (brain.yaml `model`), e.g. delivery"}
